services:
  - type: web
    name: convo-companion-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_BASE_URL
        value: https://convo-companion-api.onrender.com/api
      - key: VITE_LIGHTRAG_API_URL
        value: https://overhumane-sloppily-su.ngrok-free.dev
  
  - type: web
    name: convo-companion-api
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: MONGODB_URI
        fromDatabase:
          name: mongodb
      - key: PORT
        value: "3000"

databases:
  - name: mongodb
    plan: free

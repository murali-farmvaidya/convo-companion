# ⚠️ SECURITY WARNING: Replace placeholder values with your actual credentials
# DO NOT commit this file with real credentials to a public repository!
# It's recommended to set environment variables directly in Render dashboard instead.

services:
  - type: web
    name: bhuvi-chatbot-ui
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host
    envVars:
      - key: VITE_API_BASE_URL
        value: https://your-backend-url.onrender.com/api
      - key: VITE_LIGHTRAG_API_URL
        value: https://your-lightrag-url-or-backend-proxy
  
  - type: web
    name: bhuvi-chatbot
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: MONGODB_URI
        value: your-mongodb-connection-string-here
      - key: PORT
        value: "3000"
      - key: OPENAI_API_KEY
        value: your-openai-api-key-here
